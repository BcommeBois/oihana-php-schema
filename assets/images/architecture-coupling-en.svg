<text class="sans badge-text" x="33" y="622" text-anchor="middle">2</text>
<text class="mono chiptext xyz-ink" x="52" y="622">business\documents ⇄ products</text>
<text class="mono foot muted" x="52" y="638">business\documents → products : BusinessDocumentLine→Product, DeliveryLine→Product, GoodsReceiptLine→Product</text>
<text class="mono foot muted" x="52" y="653">products → business\documents : PricingCondition→Adjustment</text>
<circle class="badge" cx="33" cy="675" r="9"/>
<text class="sans badge-text" x="33" y="679" text-anchor="middle">3</text>
<text class="mono chiptext xyz-ink" x="52" y="679">auth ⇄ business</text>
<text class="mono foot muted" x="52" y="695">auth → business : User→BusinessIdentity</text>
<text class="mono foot muted" x="52" y="710">business → auth : UserProfile→Role</text>
<circle class="badge" cx="33" cy="732" r="9"/>
<text class="sans badge-text" x="33" y="736" text-anchor="middle">4</text>
<text class="mono chiptext xyz-ink" x="52" y="736">places ⇄ shipping</text>
<text class="mono foot muted" x="52" y="752">places → shipping : Site→DeliveryRouteAssignment</text>
<text class="mono foot muted" x="52" y="767">shipping → places : DeliveryRouteAssignment→Site</text>
