<text class="sans foot-title muted" x="24" y="540">The mutual references, class by class</text>
<circle class="badge" cx="33" cy="561" r="9"/>
<text class="sans badge-text" x="33" y="565" text-anchor="middle">1</text>
<text class="mono chiptext xyz-ink" x="52" y="565">organizations ⇄ products</text>
<text class="mono foot muted" x="52" y="581">organizations → products : Company→TaxRate, Customer→PriceSegmentation, Provider→ProductProviderInfo</text>
<text class="mono foot muted" x="52" y="596">products → organizations : CustomerOffer→Customer, PricingCondition→Customer, PricingCondition→Provider, PricingCondition→Subsidiary</text>
